# langchain-model-preset-gen — 공식 벤더 엔드포인트 (배포자 소유)
# serving_provider → {provider_class, base_url, api_key_env}. base_url null = provider_classes.yaml native_base_url.
# 사이트 전용 엔드포인트(로컬 vLLM 등)는 여기가 아니라 configs/config.yaml 의 providers 에 둔다.
# 같은 이름을 configs 에 다시 적으면 발행·실측이 ValueError 로 거부한다(사이트가 공식 이름을 가리지 않게).
openai:
  provider_class: openai
  base_url: null
  api_key_env: OPENAI_API_KEY
anthropic:
  provider_class: anthropic
  base_url: null
  api_key_env: ANTHROPIC_API_KEY
google:
  provider_class: google
  base_url: null
  api_key_env: GOOGLE_API_KEY
deepseek:
  provider_class: openai_compatible
  base_url: "https://api.deepseek.com"
  api_key_env: DEEPSEEK_API_KEY
openrouter:                     # model = vendor/slug (예 moonshotai/kimi-k2.6)
  provider_class: openai_compatible
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: OPENROUTER_API_KEY
  embedding_models_path: /embeddings/models   # 선택 키 — /models 는 채팅 모델만 나열한다. preflight v1 임베딩 확인용
zai:                            # trailing slash 필수 (없으면 404). model = glm-5.2 소문자
  provider_class: openai_compatible
  base_url: "https://api.z.ai/api/paas/v4/"
  api_key_env: ZAI_API_KEY
minimax:                        # model = MiniMax-M3 (대소문자 그대로)
  provider_class: openai_compatible
  base_url: "https://api.minimax.io/v1"
  api_key_env: MINIMAX_API_KEY
kimi:                           # model = kimi-k2.6 / kimi-k2.7-code
  provider_class: openai_compatible
  base_url: "https://api.moonshot.ai/v1"
  api_key_env: KIMI_API_KEY
