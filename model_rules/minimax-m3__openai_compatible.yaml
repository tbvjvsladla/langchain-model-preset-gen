# 모델 규칙 1건 — 작성법은 model_rules/README.md
match: minimax-m3
provider_class: openai_compatible
injection: xb_thinking
mapping:
  none: {action: disable}
  low: {action: set, value: enable}
  medium: {action: set, value: enable}
  high: {action: set, value: enable}
  xhigh: {action: set, value: enable}
  max: {action: set, value: enable}
end_marker: null
sampling: {temperature: accepted, top_p: accepted, top_k: rejected}
basis: 'api.minimax.io: thinking {type: enabled} 토글, 사고 기본 on·단계 없음(이전 조사 minimax-m3) → none=disable, 나머지 enable'
