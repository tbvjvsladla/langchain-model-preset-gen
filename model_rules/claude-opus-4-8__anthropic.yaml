# 모델 규칙 1건 — 작성법은 model_rules/README.md
match: claude-opus-4-8
provider_class: anthropic
injection: anthropic_adaptive_effort
mapping:
  none: {action: disable}
  low: {action: set, value: low}
  medium: {action: set, value: medium}
  high: {action: set, value: high}
  xhigh: {action: set, value: xhigh}
  max: {action: set, value: max}
end_marker: null
sampling: {temperature: rejected, top_p: rejected, top_k: rejected}
basis: effort low~max 5단계 + thinking adaptive(OR 메타 claude-opus-4.8 default_enabled false — live 2026-10-15 effort 단독 사고 0, adaptive 동반 시 thinking 블록) → none=thinking disabled, temp rejected(이전 조사)
