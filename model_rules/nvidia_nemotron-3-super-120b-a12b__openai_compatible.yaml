# 모델 규칙 1건 — 작성법은 model_rules/README.md
match: nvidia/nemotron-3-super-120b-a12b
provider_class: openai_compatible
injection: or_reasoning
mapping:
  none: {action: disable}
  low: {action: set, value: low}
  medium: {action: set, value: medium}
  high: {action: set, value: medium}
  xhigh: {action: set, value: medium}
  max: {action: set, value: medium}
end_marker: null
sampling: {temperature: accepted, top_p: accepted, top_k: accepted}
basis: OR 메타 efforts medium·low, mandatory false → high·xhigh·max=medium(상한)
