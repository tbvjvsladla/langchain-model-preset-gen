# 모델 규칙 1건 — 작성법은 model_rules/README.md
match: poolside/laguna-s-2.1
provider_class: openai_compatible
injection: or_reasoning
mapping:
  none: {action: disable}
  low: {action: set, value: enable}
  medium: {action: set, value: enable}
  high: {action: set, value: enable}
  xhigh: {action: set, value: enable}
  max: {action: set, value: enable}
end_marker: null
sampling: {temperature: accepted, top_p: rejected, top_k: rejected}
basis: OR 메타 mandatory false·default_enabled true·단계 없음 → 토글형(laguna-xs-2.1 sweep off 0·on 1774자); 라우트는 temperature 만 받음(top_p·top_k 미지원)
