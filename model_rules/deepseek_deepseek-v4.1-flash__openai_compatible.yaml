# 모델 규칙 1건 — 작성법은 model_rules/README.md
match: deepseek/deepseek-v4.1-flash
provider_class: openai_compatible
injection: or_reasoning
mapping:
  none: {action: disable}
  low: {action: set, value: low}
  medium: {action: set, value: high}
  high: {action: set, value: high}
  xhigh: {action: set, value: max}
  max: {action: set, value: max}
end_marker: null
sampling:
  temperature:
    by_effort: {none: accepted, default: ignored}
  top_p:
    by_effort: {none: accepted, default: ignored}
  top_k: accepted
basis: OR 메타 efforts max·high·low, mandatory false → low 그대로·medium=high·xhigh=max; sweep 2차 off 0·on 80자; 벤더 문서상 사고 모드는 샘플링 무시(이전 조사 mode_bound)
